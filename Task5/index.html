<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
        
    <body>
        <header>
            <h1 id="head">Tic Tac Toe Game</h1>
        </header>
        
        
        <div id="result"></div>
        
        <section id="game">
            <div id = "tac">
                <div id="tic">
                

                
                </div>
                <center><button id="new">NEW GAME</button></center>
            </div>
            
            
            
            <div id="rules">
               <h2>Rules</h2>
                <p>Each player has to take turns</p>
                <p>The player who fills 3 consecutive rows first wins</p>
                <p>You can start a new game at any point</p>

                <center>
                    <label for="userInput">Enter the number of games to play (1-10): </label>
                    <input type="text" id="numGames"/>
                    <label for="boardSize">Enter the boardSize(3-10): </label>
                    <input type="text" id="boardSize"/>
                    <button id="submitGames">Submit</button>
                </center>
            </div>
            
        </section>
       
        
        <script type="text/javascript" src="script.js"></script>
    </body>
</html>
